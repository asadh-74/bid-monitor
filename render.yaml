services:
  - type: web
    name: sca-factsheet-scraper
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bid-monitor-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SCRAPE_INTERVAL_HOURS
        value: "12"
      - key: RENDERER
        value: "playwright"
    healthCheckPath: /health
databases:
  - name: bid-monitor-db
    plan: basic-256mb
