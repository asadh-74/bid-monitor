services:
  - type: web
    name: sca-factsheet-scraper
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ENABLE_LOCAL_SCRAPING
        value: "false"
      - key: SCRAPE_INTERVAL_HOURS
        value: "0"
      - key: RENDERER
        value: "playwright"
      - key: NYSCR_MAX_PAGES
        value: "40"
    healthCheckPath: /health
